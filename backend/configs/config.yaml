models:
  gru:
    checkpoint: "resources/final_physics_regularized_gru.pth"
    scaler: "resources/NeuroSymbolic_LSTM_scaler.pkl"
    type: "recurrent"
    input_dim: 33
    output_type: "per_timestep"
    decision_threshold: 0.50

  lstm:
    checkpoint: "resources/NeuroSymbolic_LSTM_final.pt.zip"
    scaler: "resources/NeuroSymbolic_LSTM_scaler.pkl"
    type: "recurrent"
    input_dim: 33
    output_type: "per_timestep"
    decision_threshold: 0.50

  tcn:
    checkpoint: "resources/satellite_tcn_modelt4.pt.zip"
    scaler: "resources/NeuroSymbolic_LSTM_scaler.pkl"
    type: "convolutional"
    input_dim: 33
    output_type: "per_timestep"
    decision_threshold: 0.44

  transformer:
    checkpoint: "resources/causal_transformer_physics.pt.zip"
    scaler: "resources/NeuroSymbolic_LSTM_scaler.pkl"
    type: "attention"
    input_dim: 33
    output_type: "per_timestep"
    decision_threshold: 0.50

  patchtst:
    checkpoint: "resources/patchtst_model.pt.zip"
    type: "patch_transformer"
    input_dim: 44
    output_type: "event_level"
    decision_threshold: 0.50

  xgboost:
    checkpoint: "resources/xgboost_model.pt.zip"
    type: "tree_ensemble"
    input_dim: 45
    output_type: "tabular_probabilities"
    decision_threshold: 0.50

xai:
  integrated_gradients:
    n_steps: 500
    method: "gausslegendre"
    baseline: "zeros"
  tree_shap:
    background_samples: 100
  faithfulness:
    perturbation_steps: [0.1, 0.2, 0.3, 0.5, 0.7, 1.0]
    metric: "area_over_perturbation_curve"
  stability:
    noise_level: 0.05
    n_trials: 10
    top_k: [1, 3, 5]

physics_shield:
  rules:
    delta_v_feasibility:
      type: "Type A (Hard Physical Constraint)"
      condition: "deltav_required > max_delta_v"
      action: "override_to_wait"
    tca_passed:
      type: "Type A (Hard Temporal Constraint)"
      condition: "time_to_TCA <= 0"
      action: "override_to_wait"
    window_expired:
      type: "Type A (Hard Operational Constraint)"
      condition: "maneuver_window_remaining <= 0"
      action: "override_to_wait"

artifacts_dir: "research_artifacts"
