project:
  name: "Research-Grade Causal + XAI + Neuro-Symbolic Analysis Framework"
  domain: "Satellite Collision Avoidance & Maneuver Commitment"
  version: "1.0.0"
  seed: 42
  device: "cpu" # deterministic execution across environments

data:
  dataset_path: "resources/capstone_final_merged_dataset.csv"
  total_rows: 60000
  total_events: 3000
  steps_per_event: 20
  event_col: "event_id"
  time_col: "time_index"
  target_col: "commit_decision"
  orbit_col: "orbit_type"
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    strategy: "group_shuffle_split"
    group_col: "event_id"
    seed: 42

